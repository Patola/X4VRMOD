#
# The shipping line as defaults (docs/packaging-plan.md, Phase 0): the
# launcher (launch/x4vr-defaults.sh) exports each of these that is not
# already set, so `./launch/x4vr-launch.sh` alone plays like v0.9.8. An
# explicit setting always wins; write VAR=0 to turn one off, or
# X4VR_DEFAULTS=0 to apply none of them (an old take's command line, replayed
# exactly). Generated from take 375's logged run line minus its instruments.
#
# Derived, not listed: X4VR_W (2 x X4VR_H) and X4VR_RES (X4VR_H x X4VR_H).
# Not listed: X4VR_IPD. Unset, the scene takes the headset's eye distance.
#
# kind      variable                        value

setting    X4VR_H                          2816     # eye size in pixels (square eyes); X4VR_W and X4VR_RES follow it
setting    X4VR_FOV                        1.4917   # X4's field of view, radians
setting    X4VR_HEAD_6DOF                  1        # lean: head position in the cockpit
setting    X4VR_VR                         1        # submit to the OpenXR runtime (0: flatscreen side-by-side only)
setting    X4VR_UPSCALE                    none     # X4's upscaler (README: Resolution and upscaling)

internal   X4VR_BINDLESS_MIRROR            1
internal   X4VR_BINDLESS_PATCH             1
internal   X4VR_CAMLOOP                    1
internal   X4VR_CAMREAD                    1
internal   X4VR_CANVAS_M                   1000
internal   X4VR_CSM_COVER                  0.663
internal   X4VR_CURSOR_CANVAS              auto
internal   X4VR_DECLARE_RENDERED_POS       1
internal   X4VR_DECLARE_RENDERED_ROT       2
internal   X4VR_EXTENSIONS                 1
internal   X4VR_GAMESCOPE                  1
internal   X4VR_HEADLOOK                   1
internal   X4VR_HEADLOOK_EXTERNAL          1
internal   X4VR_HEADLOOK_FOOT              1
internal   X4VR_HEADLOOK_GAIN              0.115
internal   X4VR_HEADLOOK_KP                0.25
internal   X4VR_HEADLOOK_LEAD              1.0
internal   X4VR_HEADLOOK_MENU_CENTRE       1
internal   X4VR_HEADLOOK_PITCH_LIMIT       75
internal   X4VR_HEADLOOK_RAW               191
internal   X4VR_HEADLOOK_WRITE             1
internal   X4VR_HEADLOOK_YAW_LIMIT         180
internal   X4VR_HUD_MOUSE                  1
internal   X4VR_LOADING_ART                1
internal   X4VR_MASK_PRESENT               1
internal   X4VR_MV                         1
internal   X4VR_OFFAXIS                    off
internal   X4VR_POSE                       1
internal   X4VR_PROJ_INVPROJ               1
internal   X4VR_PROJ_LIVE                  1
internal   X4VR_ROLL_STEREO                1
internal   X4VR_SBS                        1
internal   X4VR_SBS_LAYERS                 2
internal   X4VR_SBS_RIGHT_LAYER            1
internal   X4VR_STEER                      a
internal   X4VR_STEER_PICK                 1
internal   X4VR_STEREO                     1
internal   X4VR_UI_FOV                     1.0
internal   X4VR_UI_WGATE                   0.02
internal   X4VR_UI_WGATE_W1                0

# The debug level, only with X4VR_DEBUG=1 (`x4vrmod run --debug`, the launcher's "Play
# with debug log"): take 375's instruments. They write to the log and change nothing
# the player sees. Tens of MB per session; for reproducing a bug, then off.
debug      X4VR_HEADLOOK_LAGLOG            1        # the head-look servo's lag samples
debug      X4VR_POSELOG                    1        # the head pose
debug      X4VR_CAMDIFF                    1        # X4's camera against ours
debug      X4VR_CAMSTAMP                   1        # when each camera was read
debug      X4VR_HOVERLOG                   1        # what the cursor points at
debug      X4VR_FOOTLOG                    1        # the walking view's angles

