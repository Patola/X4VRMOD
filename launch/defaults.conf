#
# The shipping line as defaults (docs/packaging-plan.md, Phase 0): the
# launcher (launch/x4vr-defaults.sh) exports each of these that is not
# already set, so `./launch/x4vr-launch.sh` alone plays like v0.9.8. An
# explicit setting always wins; write VAR=0 to turn one off, or
# X4VR_DEFAULTS=0 to apply none of them (an old take's command line, replayed
# exactly). Generated from take 375's logged run line minus its instruments.
#
# Derived, not listed: X4VR_W (2 x X4VR_H), X4VR_RES (X4VR_H x X4VR_H) and
# X4VR_UPSCALE (fsr_quality above 2816 per eye, none otherwise; decision 6).
#
# kind      variable                        value

setting    X4VR_H                          2816     # eye size in pixels (square eyes); X4VR_W and X4VR_RES follow it
setting    X4VR_FOV                        1.4917   # X4's field of view, radians
setting    X4VR_IPD                        0.064    # eye separation, metres
setting    X4VR_HEAD_6DOF                  1        # lean: head position in the cockpit
setting    X4VR_VR                         1        # submit to the OpenXR runtime (0: flatscreen side-by-side only)

internal   X4VR_BINDLESS_MIRROR            1
internal   X4VR_BINDLESS_PATCH             1
